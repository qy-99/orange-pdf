<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Warm Technical Orange Primary Accent -->
    <linearGradient id="orangeGrad" x1="140" y1="160" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Platinum Document Gradient -->
    <linearGradient id="docGrad" x1="160" y1="100" x2="360" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Fold Corner Gradient -->
    <linearGradient id="foldGrad" x1="280" y1="100" x2="340" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="iconShadow" x="100" y="70" width="312" height="372" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Main Geometric Group -->
  <g filter="url(#iconShadow)">
    <!-- Base Lower Sheet: Shifted Split Half in Vibrant Technical Orange -->
    <path
      d="M172 260 L248 184 H332 C345.255 184 356 194.745 356 208 V384 C356 397.255 345.255 408 332 408 H196 C182.745 408 172 397.255 172 384 V260 Z"
      fill="url(#orangeGrad)"
    />

    <!-- Precision Diagonal Split Gap Shadow (Technical Cut) -->
    <path
      d="M152 254 L258 148 L272 162 L166 268 Z"
      fill="#000000"
      fill-opacity="0.25"
    />

    <!-- Upper Main Sheet: Minimalist Architectural Platinum Document with Folded Corner -->
    <path
      d="M156 104 C156 90.745 166.745 80 180 80 H284 L340 136 V240 L234 346 H180 C166.745 346 156 335.255 156 322 V104 Z"
      fill="url(#docGrad)"
    />

    <!-- Architectural Precision Folded Corner -->
    <path
      d="M284 80 V124 C284 130.627 289.373 136 296 136 H340 Z"
      fill="url(#foldGrad)"
    />

    <!-- Precision Technical Grid / Split Marks -->
    <circle cx="212" cy="156" r="6" fill="#f97316"/>
    <rect x="232" y="153" width="36" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>

    <circle cx="212" cy="188" r="6" fill="#f97316"/>
    <rect x="232" y="185" width="56" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>

    <circle cx="212" cy="220" r="6" fill="#f97316"/>
    <rect x="232" y="217" width="44" height="6" rx="3" fill="#64748b" fill-opacity="0.6"/>

    <!-- Split Action Cut Line Indicator -->
    <line x1="140" y1="272" x2="276" y2="136" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" stroke-opacity="0.9"/>
  </g>
</svg>
